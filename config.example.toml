# KalshiKommander configuration. Copy to config.toml and edit.
# PAPER / SIMULATED ONLY: there is deliberately no setting that enables live trading,
# and keys such as api_key / live_trading are rejected on load.

[market]
# "sample"        -> clearly labeled fictional data (works offline; separate data/sample.db)
# "kalshi_public" -> Kalshi's public, unauthenticated market-data API (data/kalshi_public.db)
source = "sample"
# YOUR timezone: used to display times and for the daily paper-loss limit.
timezone = "America/New_York"
# Legacy single-city setting (still works). Prefer the dashboard's Cities page or [[cities]] below.
series_ticker = ""
city_label = ""

[model]
# ASSUMPTION, not calibrated: std. dev. (°F) of (reported high - forecast high).
default_sigma_f = 3.0
sensitivity_sigmas_f = [1.5, 2.0, 3.0, 4.0, 5.0]

[paper]
starting_cash = 1000.0
taker_fee_rate = 0.07          # verify against Kalshi's current fee schedule
safety_margin = 0.05           # required edge after fees and slippage (probability points)
slippage_per_contract = 0.01   # $ added to every simulated fill
fill_fraction_of_displayed = 0.5
min_contracts = 1
max_quote_age_seconds = 300
max_forecast_age_hours = 12.0
max_stake_per_market = 25.0
max_total_exposure = 100.0
max_daily_loss = 50.0
require_terms_ack = true

# Cities to follow (optional; you can also add them on the dashboard's Cities page).
# Each city's timezone decides what "today" means for its markets.
# [[cities]]
# series_ticker = "KXHIGHCHI"
# label = "Chicago"
# timezone = "America/Chicago"
# latitude = 41.79      # optional forecast location; known cities get a suggested station
# longitude = -87.75

[weather]
# Automatic forecasts: "open_meteo" (free, worldwide), "nws" (free, US only) or "manual" (type them yourself).
provider = "open_meteo"
refetch_minutes = 60           # fetch at most this often per city
nws_user_agent = "KalshiKommander-research (your-email@example.com)"

[auto]
# While `serve` runs, update prices + forecasts every N minutes (0 = off, minimum 5).
update_every_minutes = 0
# Automatic updates also record a timestamped decision for every contract (no paper orders are placed).
record_decisions = true
